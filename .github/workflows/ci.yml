name: EZER CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  DB_ENGINE: sqlite

jobs:
  # ── Job 1: Tests ────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit + functional tests
        env:
          DB_ENGINE: sqlite
        run: |
          python -m pytest tests/ -v \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-omit="tests/*,source_code/*,ezer_tests/*,data/generate.py" \
            -q

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ── Job 2: Security scan ────────────────────────────────────────────────────
  security:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run bandit
        run: |
          pip install bandit --quiet
          # -ll = medium severity and above, -ii = medium confidence and above
          # Exit 0 on low-severity only; fail on medium+ findings
          bandit -r api.py actions/ agent/ connectors/ utils/ -ll -ii \
            --skip B101,B311 \
            -f txt -o bandit-report.txt || (cat bandit-report.txt && exit 1)

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt
          retention-days: 7

  # ── Job 3: Smoke test (production-like) ────────────────────────────────────
  smoke:
    name: Smoke test (full pipeline)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke test
        env:
          DB_ENGINE: sqlite
        run: |
          python -c "
          from data.generate import build_database
          build_database()
          from models.orchestrator import train_all, run_inference_and_store
          train_all(verbose=False)
          run_inference_and_store(verbose=False)
          from agent.runner import run_agent_cycle
          run_agent_cycle(use_llm=False, verbose=False)
          from utils.db import get_connection
          conn = get_connection()
          c = conn.execute('SELECT COUNT(*) FROM customers').fetchone()[0]
          p = conn.execute(\"SELECT COUNT(*) FROM ml_predictions\").fetchone()[0]
          conn.close()
          assert c == 500, f'Expected 500 customers, got {c}'
          assert p == 500, f'Expected 500 predictions, got {p}'
          print(f'✅ Smoke test — {c} customers, {p} predictions')
          "

      - name: Test API startup
        env:
          DB_ENGINE: sqlite
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          from api import create_app
          app = create_app()
          routes = [r.path for r in app.routes]
          required = ['/health', '/dashboard', '/customers', '/agent/run']
          for r in required:
              assert r in routes, f'Missing route: {r}'
          print(f'✅ API OK — {len(routes)} routes registered')
          "
